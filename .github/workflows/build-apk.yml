name: Build Done APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source payload
        uses: actions/checkout@v4

      - name: Reconstruct verified Android project
        shell: bash
        run: |
          {
            cat payload/v2/part_000.txt
            cat payload/v2/part_001.txt
            cat payload/v2/part_002.txt
            cat payload/v2/part_003.txt
            cat payload/v2/part_004.txt
            cat payload/v2/part_005.txt
            cat payload/v2/part_006.txt
            cat payload/v2/fix007_*.txt
            cat payload/v2/part_008.txt
            cat payload/v2/part_009.txt
            cat payload/v2/part_010.txt
            cat payload/v2/part_011.txt
          } | base64 -d > /tmp/done.tar.gz
          echo "e114d8c41838dc46f2e04c19e8b5496e391d93c29b1ac1654a70e85270f14759  /tmp/done.tar.gz" | sha256sum -c -
          mkdir -p /tmp/done-src
          tar -xzf /tmp/done.tar.gz -C /tmp/done-src
          rsync -a --exclude='.git' --exclude='payload' /tmp/done-src/ ./
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Android SDK API 36
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Done APK
        uses: actions/upload-artifact@v4
        with:
          name: Done-1.0.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
