name: Build Done 1.1.0 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source payload
        uses: actions/checkout@v4

      - name: Reconstruct verified Done 1.1.0 project
        shell: bash
        run: |
          cat payload/local110/part_*.txt | base64 -d > /tmp/done.tar.gz
          echo "c78236d1adad68707a3c6f3bb3cfd8f715a970b3f37031a199f91bc664ea5d5f  /tmp/done.tar.gz" | sha256sum -c -
          mkdir -p /tmp/done-src
          tar -xzf /tmp/done.tar.gz -C /tmp/done-src
          rm -rf app gradle gradlew gradlew.bat build.gradle.kts settings.gradle.kts gradle.properties
          rsync -a --exclude='.git' --exclude='payload' --exclude='.github' /tmp/done-src/ ./
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Use preinstalled Gradle
        shell: bash
        run: gradle --version

      - name: Configure Android SDK API 36
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Done APK
        uses: actions/upload-artifact@v4
        with:
          name: Done-1.1.0-local-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
