name: Build Done 1.1.2 Compatibility APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-compat-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source payload
        uses: actions/checkout@v4

      - name: Reconstruct Done project
        shell: bash
        run: |
          cat payload/local110/part_*.txt | base64 -d > /tmp/done.tar.gz
          echo "c78236d1adad68707a3c6f3bb3cfd8f715a970b3f37031a199f91bc664ea5d5f  /tmp/done.tar.gz" | sha256sum -c -
          mkdir -p /tmp/done-src
          tar -xzf /tmp/done.tar.gz -C /tmp/done-src
          rm -rf app gradle gradlew gradlew.bat build.gradle.kts settings.gradle.kts gradle.properties
          rsync -a --exclude='.git' --exclude='payload' --exclude='.github' /tmp/done-src/ ./
          sed -i 's/applicationId = "com.aistudio.done.kpqmzx"/applicationId = "com.chezguizou.done.compat"/' app/build.gradle.kts
          sed -i 's/targetSdk = 36/targetSdk = 33/' app/build.gradle.kts
          sed -i 's/versionCode = 3/versionCode = 5/' app/build.gradle.kts
          sed -i 's/versionName = "1.1.0"/versionName = "1.1.2"/' app/build.gradle.kts
          grep -q 'applicationId = "com.chezguizou.done.compat"' app/build.gradle.kts

      - name: Configure signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 -d payload/local110/done-stable-debug.keystore.b64 > "$HOME/.android/done-test.keystore"
          chmod 600 "$HOME/.android/done-test.keystore"
          keytool -list -keystore "$HOME/.android/done-test.keystore" -storepass android -alias androiddebugkey

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Gradle
        shell: bash
        run: gradle --version

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build unsigned release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        shell: bash
        run: |
          gradle --no-daemon clean assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Align and sign for maximum compatibility
        shell: bash
        run: |
          BT=/usr/local/lib/android/sdk/build-tools/36.0.0
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=/tmp/Done-1.1.2-aligned.apk
          OUT=app/build/outputs/apk/release/Done-1.1.2-compat.apk
          "$BT/zipalign" -f -v 4 "$IN" "$ALIGNED"
          "$BT/apksigner" sign             --ks "$HOME/.android/done-test.keystore"             --ks-key-alias androiddebugkey             --ks-pass pass:android             --key-pass pass:android             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled false             --v4-signing-enabled false             --out "$OUT"             "$ALIGNED"
          test -f "$OUT"

      - name: Verify package and signatures
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/Done-1.1.2-compat.apk
          BT=/usr/local/lib/android/sdk/build-tools/36.0.0
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/apksigner" verify --min-sdk-version 24 "$APK"
          "$BT/aapt2" dump badging "$APK" | head -30
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload Done compatibility APK
        uses: actions/upload-artifact@v4
        with:
          name: Done-1.1.2-compat-apk
          path: app/build/outputs/apk/release/Done-1.1.2-compat.apk
          if-no-files-found: error
          retention-days: 14
