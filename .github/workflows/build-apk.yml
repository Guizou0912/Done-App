name: Build Done APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source payload
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          cat payload/min/part_*.txt | base64 -d > /tmp/done.tar.gz
          mkdir -p /tmp/done-src
          tar -xzf /tmp/done.tar.gz -C /tmp/done-src
          rsync -a --exclude='.git' --exclude='payload' /tmp/done-src/ ./
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Done APK
        uses: actions/upload-artifact@v4
        with:
          name: Done-1.0.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
