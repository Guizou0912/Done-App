name: Build Will Com APK

on:
  push:
    branches: [ willcom-build ]
    paths:
      - "willcom-build/**"
      - ".github/workflows/build-willcom-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct Will Com Android project
        shell: bash
        run: |
          set -euo pipefail
          base64 -d willcom-build/source.zip.b64 > /tmp/willcom.zip
          rm -rf /tmp/willcom-src
          mkdir -p /tmp/willcom-src
          unzip -q /tmp/willcom.zip -d /tmp/willcom-src
          PROJECT_DIR="$(find /tmp/willcom-src -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_DIR"
          echo "WILLCOM_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/gradlew"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "Project: $PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK API 36
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Will Com debug APK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          WILLCOM_API_BASE_URL: https://app.willcom.chezguizou.com
        run: |
          set -euo pipefail
          cd "$WILLCOM_PROJECT_DIR"
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$WILLCOM_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          cp "$APK" "$RUNNER_TEMP/WILL-COM-1.3.0-connected-debug.apk"

      - name: Upload Will Com APK
        uses: actions/upload-artifact@v4
        with:
          name: WILL-COM-1.3.0-connected-debug-apk
          path: ${{ runner.temp }}/WILL-COM-1.3.0-connected-debug.apk
          if-no-files-found: error
          retention-days: 14
