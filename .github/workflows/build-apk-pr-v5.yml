name: Build Done APK PR v5

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source payload
        uses: actions/checkout@v4

      - name: Reconstruct verified Android project
        shell: bash
        run: |
          cat payload/current/part_000.txt payload/current/part_001.txt payload/fixed/part_002a.txt payload/fixed/part_002b.txt | base64 -d > /tmp/done.tar.gz
          gzip -t /tmp/done.tar.gz
          rm -rf /tmp/done-src
          mkdir -p /tmp/done-src
          tar -xzf /tmp/done.tar.gz -C /tmp/done-src
          rsync -a --exclude='.git' --exclude='payload' /tmp/done-src/ ./
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          sed -i 's#@mipmap/ic_launcher_round#@drawable/ic_launcher_foreground#g; s#@mipmap/ic_launcher#@drawable/ic_launcher_foreground#g' app/src/main/AndroidManifest.xml

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android API 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Done APK
        uses: actions/upload-artifact@v4
        with:
          name: Done-1.0.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
